<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkX Grabber - Pro Max</title>
    <link rel="manifest" href="manifest.json">
    <!-- QR Code जेनरेट करने वाली जादुई लाइब्रेरी -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --bg-main: #060913;
            --bg-card: #0d1527;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-p: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: #ffffff;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: var(--bg-card);
            padding: 30px 24px;
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 0 60px var(--accent-glow);
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.05);
            box-sizing: border-box;
            text-align: center;
        }
        .logo-area img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            box-shadow: 0 0 20px var(--accent);
            margin-bottom: 12px;
        }
        h1 { font-size: 34px; font-weight: 800; margin: 0; }
        h1 span { color: var(--accent); }
        .subtitle { color: var(--text-p); font-size: 14px; margin: 8px 0 25px 0; }
        input {
            width: 100%; padding: 16px; border: 2px solid #1e293b;
            background: #070a14; color: white; border-radius: 14px;
            font-size: 15px; outline: none; transition: 0.3s;
            text-align: center; box-sizing: border-box; margin-bottom: 18px;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
        .main-btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: white; border: none; border-radius: 14px;
            font-size: 16px; cursor: pointer; font-weight: 700;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); box-sizing: border-box;
        }
        .format-list { margin-top: 22px; display: flex; flex-direction: column; gap: 12px; }
        .download-btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #22c55e, #4ade80);
            border: none; color: white; border-radius: 12px; font-weight: 700; cursor: pointer;
        }
        .developer-section {
            margin-top: 30px; padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
            text-align: left;
        }
        .dev-title {
            font-size: 12px; font-weight: 800; text-transform: uppercase;
            color: var(--accent); letter-spacing: 1.5px; text-align: center; margin-bottom: 15px;
        }
        .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .qr-trigger-btn {
            background: #1e293b; color: #f8fafc; border: 1px solid rgba(255,255,255,0.05);
            padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 600;
            font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: 0.2s;
        }
        .qr-trigger-btn:hover { background: var(--accent); color: #000; font-weight: 700; }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 7, 16, 0.9); z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-content {
            background: #111827; padding: 25px; border-radius: 24px;
            border: 2px solid var(--accent); text-align: center; max-width: 320px; width: 90%;
            position: relative; box-shadow: 0 0 40px var(--accent-glow);
        }
        .qr-display-area {
            background: white; padding: 15px; border-radius: 16px;
            display: inline-block; margin: 15px 0;
        }
        .close-modal-btn {
            margin-top: 15px; width: 100%; padding: 12px;
            background: #ef4444; color: white; border: none; border-radius: 10px;
            font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-area">
        <img src="https://flaticon.com" alt="Logo">
    </div>
    <h1>LinkX <span>Grabber</span></h1>
    <div class="subtitle" id="status">स्क्रीन पर कहीं भी टच करें, लिंक तुरंत ग्रैब होगा!</div>
    
    <input type="text" id="urlInput" placeholder="कॉपी किया हुआ लिंक यहाँ आएगा" readonly>
    <button id="fetchBtn" class="main-btn">मीडिया फ़ॉर्मेट चेक करें</button>
    
    <div class="format-list" id="formatList"></div>
    
    <!-- डेवलपर कस्टमाइज्ड सेक्शन -->
    <div class="developer-section">
        <div class="dev-title">Developer: मयंक शर्मा</div>
        <div class="profile-grid">
            <button class="qr-trigger-btn" onclick="openQR('Instagram')">📸 Instagram</button>
            <button class="qr-trigger-btn" onclick="openQR('Facebook')">👥 Facebook</button>
            <button class="qr-trigger-btn" onclick="openQR('X')">🐦 X (Twitter)</button>
            <button class="qr-trigger-btn" onclick="openQR('Telegram')">✈ Telegram</button>
        </div>
    </div>
</div>

<!-- जादुई क्यूआर कोड पॉप-अप मोडल -->
<div class="modal" id="qrModal">
    <div class="modal-content">
        <h3 id="modalTitle" style="margin:0; color:var(--accent);">Platform</h3>
        <div class="qr-display-area" id="qrcode"></div>
        <div style="color:#111827; font-size:12px; font-weight:700; margin-top:-5px; margin-bottom:5px;">Mayank Sharma</div>
        <button class="close-modal-btn" onclick="closeQR()">बंद करें</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
